<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git 实时状态</title>
<link rel="stylesheet" href="/style.css">
<script>
  // 在渲染前套用已保存的主题，避免刷新时先闪一下浅色
  try {
    if (localStorage.getItem('git-live-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
</script>
</head>
<body>
<main class="workspace">
  <section class="explorer">
    <header class="explorer-head">
      <div class="explorer-title">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
        <span id="workspacePath">—</span>
      </div>
      <div class="explorer-actions">
        <button id="btnPick" class="ghost-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          切换目录
        </button>
        <button id="btnTree" class="icon-btn" type="button" title="刷新文件列表" aria-label="刷新文件列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>
    <div class="tree" id="tree"></div>
  </section>

  <section class="git-panel">
    <header class="panel-head">
      <div class="panel-head-main">
        <div class="panel-title">
          <span class="live-dot" id="liveDot"></span>
          <h1 id="repoName">—</h1>
        </div>
        <p class="panel-sub" id="repoSub">工作区实时预览</p>
      </div>
      <nav class="panel-nav" aria-label="导航">
        <button class="nav-btn nav-icon" id="themeToggle" type="button" title="切换到深色主题" aria-label="切换到深色主题">
          <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.4A8.6 8.6 0 1 1 10.6 3.5a6.7 6.7 0 0 0 9.9 9.9Z"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>

    <div class="panel-body" id="panelBody"></div>

    <footer class="panel-foot">
      <button id="btnRefresh" class="icon-btn" type="button" title="立即刷新" aria-label="立即刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <label class="switch">
        <input type="checkbox" id="autoToggle" checked>
        <span class="track"></span>
        <span class="switch-label">自动刷新</span>
      </label>
      <span class="stamp" id="stamp"></span>
    </footer>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="选择项目目录">
    <header class="modal-head">
      <h3>选择项目目录</h3>
      <button id="modalClose" class="icon-btn" type="button" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="picker-input">
      <input id="pickerInput" type="text" spellcheck="false" placeholder="直接粘贴路径，例如 D:\code\my-project">
      <button id="pickerGo" class="ghost-btn" type="button">打开</button>
    </div>
    <div class="picker-list" id="pickerList"></div>
    <footer class="modal-foot">
      <button id="pickerDrives" class="ghost-btn" type="button">此电脑</button>
      <button id="pickerUp" class="ghost-btn" type="button">上一级</button>
      <button id="pickerChoose" class="primary-btn" type="button">选择此目录</button>
    </footer>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
